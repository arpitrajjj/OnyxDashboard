version: "3.9"

services:
  onyxdashboard:
    build: .
    container_name: onyxdashboard
    ports:
      - "5000:5000"
    environment:
      - ONYX_DB_PATH=/data/onyxdashboard.db
      - ONYX_HEARTBEAT_TIMEOUT=60
    volumes:
      - onyx-data:/data
    restart: unless-stopped

volumes:
  onyx-data:
