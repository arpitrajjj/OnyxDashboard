name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (syntax check)
        run: |
          python -m py_compile app.py
          echo "Syntax OK"

      - name: Run tests
        env:
          ONYX_DB_PATH: /tmp/test_onyx.db
        run: |
          pytest -v --tb=short || pytest -v --tb=short

      - name: Smoke test app boots
        env:
          ONYX_DB_PATH: /tmp/smoke_onyx.db
        run: |
          python -c "
          import app as m
          m.init_db()
          print('DB init OK')
          with m.app.test_client() as c:
              r = c.get('/healthz')
              assert r.status_code == 200, r.status_code
              print('Health endpoint OK:', r.get_json())
              r = c.get('/api/devices')
              assert r.status_code == 200, r.status_code
              j = r.get_json()
              assert j['ok'] is True
              print('Devices endpoint OK, count =', j['count'])
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: onyxdashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run image and probe
        run: |
          docker run --rm -d --name onyx -p 5050:5000 onyxdashboard:ci
          sleep 3
          curl -sf http://localhost:5050/healthz | tee /dev/stderr | grep -q '"ok":true'
          docker stop onyx
